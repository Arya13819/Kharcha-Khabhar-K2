<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js" crossorigin="anonymous"></script>
    <title>Reset Password | K2</title>
</head>
<body class="login-body">
    <div class="form">
        <h1>Reset your password</h1>
        <p>Enter your username and the security key you chose when registering.</p>

        <form action="/forgot-password" method="POST" class="ex-form">
            <label for="username">Username: <span class="required-star">*</span></label>
            <input type="text" name="username" id="username" placeholder="Ex: John" required>

            <label for="security_key">Security Key: <span class="required-star">*</span></label>
            <input type="password" name="security_key" id="security_key" maxlength="8" placeholder="Your security key" required>

            <label for="password">New Password: <span class="required-star">*</span></label>
            <div class="input-container">
                <input type="password" name="new_password" id="password" placeholder="New password" required>
                <i class="fa-solid fa-eye eye-icon" id="toggleEye" onclick="togglePassword()"></i>
            </div>

            <p id="signup-button">Remembered it? <a href="/login">Back to Login</a></p>
            <br>
            <button type="submit">Reset Password</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
